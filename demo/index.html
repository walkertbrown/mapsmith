<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mapsmith demo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
<style>
/* Obsidian's theme variables, enough for the plugin's CSS to look right */
:root {
	--background-primary: #fff;
	--background-secondary: #f2f3f5;
	--background-modifier-border: #e0e0e0;
	--interactive-accent: #7852ee;
	--interactive-normal: #f2f3f5;
	--text-normal: #222;
	--text-muted: #666;
	--text-accent: #7852ee;
	--text-error: #c0392b;
	--text-on-accent: #fff;
	--font-ui-small: 13px;
	--font-semibold: 600;
	--radius-s: 4px;
	--radius-m: 8px;
}
:root[data-theme="dark"] {
	--background-primary: #1e1e1e;
	--background-secondary: #262626;
	--background-modifier-border: #3a3a3a;
	--interactive-accent: #a882ff;
	--interactive-normal: #363636;
	--text-normal: #dadada;
	--text-muted: #999;
	--text-accent: #a882ff;
	--text-error: #ff8a80;
}
html, body { margin: 0; background: var(--background-primary); color: var(--text-normal); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; }
@media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
h1 { font-size: 1.3em; margin: 0 0 4px; }
p.lede { color: var(--text-muted); margin: 0 0 14px; }
button, select { font: inherit; font-size: 14px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--background-modifier-border); background: var(--interactive-normal); color: var(--text-normal); cursor: pointer; }
button.mod-cta { background: var(--interactive-accent); color: var(--text-on-accent); border-color: transparent; }
textarea { width: 100%; box-sizing: border-box; height: 150px; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--background-secondary); color: var(--text-normal); border: 1px solid var(--background-modifier-border); border-radius: 6px; padding: 8px; }
pre { white-space: pre-wrap; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--text-muted); }
aside h2 { font-size: 0.95em; margin: 14px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
	<main>
		<h1>Mapsmith</h1>
		<p class="lede">A town, a ship or a dungeon from a seed, drawn in a note. Click a number to see what's there. <button id="try-town">Town</button> <button id="try-ship">Ship</button> <button id="try-dungeon">Dungeon</button></p>
		<div id="board"></div>
	</main>
	<aside>
		<button id="theme">Light / dark</button>
		<h2>The block in the note</h2>
		<textarea id="source" spellcheck="false"></textarea>
		<h2>Notes it made</h2>
		<pre id="made"></pre>
	</aside>
</div>
<script src="./demo.js"></script>
</body>
</html>
